name: Build RUDHAR APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare project
        run: |
          unzip -o rudhar-android.zip
          HTML=$(ls *.html | head -n1)
          echo "Using $HTML"
          mkdir -p app/src/main/assets
          cp "$HTML" app/src/main/assets/index.html
          if [ -f logo.png ]; then
            mkdir -p app/src/main/res/drawable
            cp logo.png app/src/main/res/drawable/ic_launcher.png
            sed -i 's|android:label="RUDHAR"|android:label="RUDHAR" android:icon="@drawable/ic_launcher"|' app/src/main/AndroidManifest.xml
          fi
      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: RUDHAR-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RUDHAR APK build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
